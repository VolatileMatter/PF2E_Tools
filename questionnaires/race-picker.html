<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PF2E — Ancestry Picker Questionnaire</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared.css">
  <style>
    .home-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: transparent;
      border: 1px solid var(--card-border);
      border-radius: var(--radius-sm);
      padding: 0.5rem 1rem;
      font-family: 'Cinzel', serif;
      font-size: 0.75rem;
      color: var(--text-muted);
      text-decoration: none;
      transition: all 0.15s;
      margin-bottom: 1rem;
    }
    .home-link:hover {
      border-color: var(--gold);
      color: var(--gold);
    }

    .q-card, .choice-btn, .stat-prompt, .q-text, .q-sub, .choice-title, .choice-sub {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    
    .q-text {
      font-weight: 500;
      font-size: 1.35rem;
      line-height: 1.4;
    }
    
    .choice-title {
      font-weight: 600;
      font-size: 1rem;
    }
    
    .choice-sub {
      font-weight: 400;
      font-size: 0.85rem;
    }
    
    .site-header h1, .site-header .eyebrow, .result-name, .box-title, .section-title {
      font-family: 'Cinzel', serif;
    }
    
    .stat-prompt {
      background: var(--gold-faint);
      border: 1px solid var(--gold-border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin: 1rem 0;
    }

    .stat-selector {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin: 1rem 0;
    }

    .stat-select {
      flex: 1;
      min-width: 150px;
    }

    .stat-select label {
      display: block;
      font-family: 'Cinzel', serif;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      color: var(--gold);
      margin-bottom: 0.5rem;
    }

    .stat-select select {
      width: 100%;
      padding: 0.75rem;
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      cursor: pointer;
    }

    .ability-scores-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }

    .ancestry-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 1rem;
      transition: all 0.15s;
    }

    .ancestry-card h3 {
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      color: var(--gold-light);
      margin-bottom: 0.25rem;
    }

    .ancestry-source {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-family: 'Cinzel', serif;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }

    .ancestry-desc {
      font-size: 0.9rem;
      color: var(--text);
      line-height: 1.4;
      margin-bottom: 0.75rem;
      font-family: 'Inter', sans-serif;
    }

    .ancestry-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .stat-boost {
      background: rgba(201, 168, 76, 0.15);
      border: 1px solid var(--gold-border);
      border-radius: 20px;
      padding: 0.2rem 0.6rem;
      font-size: 0.7rem;
      color: var(--gold);
      font-family: 'Inter', sans-serif;
    }

    .stat-flaw {
      background: rgba(139, 32, 32, 0.2);
      border: 1px solid rgba(139, 32, 32, 0.4);
      border-radius: 20px;
      padding: 0.2rem 0.6rem;
      font-size: 0.7rem;
      color: var(--red-text);
      font-family: 'Inter', sans-serif;
    }

    .ancestry-link {
      display: inline-block;
      font-size: 0.75rem;
      color: var(--blue-text);
      text-decoration: none;
      border: 1px solid var(--blue-border);
      padding: 0.25rem 0.75rem;
      border-radius: var(--radius-sm);
      transition: all 0.15s;
      font-family: 'Inter', sans-serif;
    }

    .elimination-log {
      background: rgba(0, 0, 0, 0.3);
      border-radius: var(--radius);
      padding: 1rem;
      margin-bottom: 1.5rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body>
<div class="container">

  <a href="../index.html" class="home-link">← Back to all questionnaires</a>

  <header class="site-header">
    <div class="eyebrow">Pathfinder Second Edition</div>
    <h1>What Ancestry Should I Play?</h1>
    <p class="subtitle">Find your perfect heritage through 17 questions</p>
  </header>

  <div id="app"></div>

</div>

<script>
let ANCESTRIES = [];
let ancestryMap = new Map();

// Questions with proper options
// Each question has: text, sub, type, eliminateOnNo (for avoidance questions), keepOnYes (for requirement questions)
const QUESTIONS = [
  {
    id: "q0",
    text: "Do you want to limit yourself to only Core Rulebook ancestries?",
    sub: "Core Rulebook ancestries: Dwarf, Elf, Gnome, Goblin, Halfling, Human",
    type: "limit",
    eliminateIfPrefer: ["non_core"]  // "Yes, only Core" eliminates non_core
  },
  {
    id: "q1",
    text: "Is it okay if your ancestry is universally feared, hated, or enslaved in most of Golarion?",
    sub: "Examples: Goblins, Orcs, Kobolds, Drow, and similar ancestries with difficult reputations.",
    type: "avoid",
    avoidTag: "feared_culture"
  },
  {
    id: "q2",
    text: "Is it okay if your character has no conventional soul (reincarnating, construct, or undead)?",
    sub: "Examples: Samsaran, Skeleton, Automaton, Android, Poppet.",
    type: "avoid",
    avoidTag: "no_soul"
  },
  {
    id: "q3",
    text: "Is it okay if your character has a strong compulsion, taboo, or instinct that limits roleplay?",
    sub: "Examples: Kobolds serving dragons, Tengu hoarding shiny objects, Hobgoblins' rigid discipline.",
    type: "avoid",
    avoidTag: "compulsion"
  },
  {
    id: "q4",
    text: "Is it okay if you are obviously non-human (fur, scales, feathers, plant body)?",
    sub: "NPCs will often react to you as strange or frightening.",
    type: "avoid",
    avoidTag: "non_human_appearance"
  },
  {
    id: "q5",
    text: "Do you prefer to be a mammal (warm-blooded with fur/hair)?",
    sub: "Answer YES to prefer mammals, NO to prefer non-mammals (reptiles, birds, plants, fish).",
    type: "preference",
    preferYesTag: "mammal",
    preferNoTag: "non_mammal"
  },
  {
    id: "q6",
    text: "Is it okay to be a non-mammal (reptile, bird, plant, amphibian, fish)?",
    sub: "Examples: Lizardfolk, Tengu, Leshy, Grippli, Merfolk.",
    type: "avoid",
    avoidTag: "non_mammal"
  },
  {
    id: "q7",
    text: "Is it okay to be Small size (2-4 feet tall)?",
    sub: "Small ancestries: Goblins, Halflings, Kobolds, Ratfolk, Sprites, Gnomes, Leshys.",
    type: "avoid",
    avoidTag: "small"
  },
  {
    id: "q8",
    text: "Is it okay to be Large size (7-10+ feet tall)?",
    sub: "Large ancestries: Centaur, Minotaur, Jotunborn (giant-kin).",
    type: "avoid",
    avoidTag: "large"
  },
  {
    id: "q9",
    text: "Does your ancestry need to have extra useful limbs (more than 2 arms/legs, functional tail, wings, etc.)?",
    sub: "Examples: Centaurs (4 legs), Vanara (prehensile tail), Strix (wings), Anadi (8 legs).",
    type: "require",
    requireTag: "extra_limbs"
  },
  {
    id: "q10",
    text: "Is it okay to be a construct or animated object (no need to eat/sleep/breathe)?",
    sub: "Examples: Automaton, Poppet, Skeleton, Android.",
    type: "avoid",
    avoidTag: "construct"
  },
  {
    id: "q11",
    text: "Is it okay to be made of living plant matter (vulnerable to fire & plant magic)?",
    sub: "Examples: Leshy and Ghoran.",
    type: "avoid",
    avoidTag: "plant"
  },
  {
    id: "q12",
    text: "Is it okay to have light blindness (dazzled in sunlight, need goggles or magic to function outdoors)?",
    sub: "Examples: Some Kobold heritages and Drow.",
    type: "avoid",
    avoidTag: "light_blindness"
  },
  {
    id: "q13",
    text: "Do you require darkvision (ability to see in total darkness as if it were dim light)?",
    sub: "Ancestries with darkvision: Dwarf, Elf, Orc, Hobgoblin, Kobold, Fetchling, Strix, Caligni, Surki, Drow, Wayang.",
    type: "require",
    requireTag: "requires_darkvision"
  },
  {
    id: "q14",
    text: "Is it okay to need to breathe water (can't stay on land long without magic or equipment)?",
    sub: "Aquatic ancestries: Merfolk, Athamaru, Azarketi, Undine.",
    type: "avoid",
    avoidTag: "water_breather"
  },
  {
    id: "q15",
    text: "Is it okay to be unable to walk on land without assistance (magic, wheelchair, being carried)?",
    sub: "This primarily affects Merfolk and fully aquatic ancestries.",
    type: "avoid",
    avoidTag: "land_disabled"
  },
  {
    id: "q16",
    text: "Is it okay to have body shape restrictions (can't wear standard armor or use standard weapons)?",
    sub: "Affects Centaurs, Strix, Awakened Animals, Nagaji, Merfolk.",
    type: "avoid",
    avoidTag: "body_shape_restriction"
  }
];

let currentQuestionIndex = 0;
let answers = [];
let eliminatedAncestries = new Set();
let remainingAncestries = [];
let showStatPrompt = false;
let primaryStat = "";
let secondaryStat = "";

async function loadAncestries() {
  const sourceFiles = [
    "core-rulebook.json",
    "advanced-players-guide.json",
    "lost-omens-character-guide.json",
    "ancestry-guide.json",
    "miscellaneous-ancestries.json"
  ];
  
  const loaded = [];
  
  for (const sourceFile of sourceFiles) {
    try {
      const res = await fetch(`../races/${sourceFile}`);
      if (res.ok) {
        const data = await res.json();
        for (const ancestry of data.ancestries) {
          ancestry.source = data.source;
          loaded.push(ancestry);
          ancestryMap.set(ancestry.id, ancestry);
        }
      }
    } catch (e) {
      console.warn(`Could not load ${sourceFile}:`, e);
    }
  }
  
  ANCESTRIES = loaded;
  return ANCESTRIES.length > 0;
}

function computeEliminations() {
  eliminatedAncestries.clear();
  
  for (const ancestry of ANCESTRIES) {
    let eliminated = false;
    let eliminationReason = null;
    
    for (let i = 0; i < QUESTIONS.length; i++) {
      const q = QUESTIONS[i];
      const answer = answers[i];
      if (answer === undefined || answer === "dontcare") continue;
      
      // Q0: "Yes, only Core" eliminates non_core
      if (i === 0 && answer === "yes") {
        if (!ancestry.tags || !ancestry.tags.includes("core")) {
          eliminated = true;
          eliminationReason = `Q0: You want only Core Rulebook ancestries, but ${ancestry.name} is not from Core Rulebook.`;
          break;
        }
        continue;
      }
      
      // Q5: Mammal vs non-mammal preference
      if (i === 5) {
        if (answer === "yes") {
          // Prefer mammals - eliminate non-mammals
          if (!ancestry.tags || !ancestry.tags.includes("mammal")) {
            eliminated = true;
            eliminationReason = `Q5: You prefer mammals, but ${ancestry.name} is not a mammal.`;
            break;
          }
        } else if (answer === "no") {
          // Prefer non-mammals - eliminate mammals
          if (!ancestry.tags || !ancestry.tags.includes("non_mammal")) {
            eliminated = true;
            eliminationReason = `Q5: You prefer non-mammals, but ${ancestry.name} is a mammal.`;
            break;
          }
        }
        continue;
      }
      
      // "avoid" type questions: "No, avoid X" eliminates ancestries with the tag
      if (q.type === "avoid" && answer === "no") {
        if (ancestry.tags && ancestry.tags.includes(q.avoidTag)) {
          eliminated = true;
          eliminationReason = `Q${i}: You want to avoid ${q.avoidTag.replace(/_/g, ' ')}, and ${ancestry.name} has this trait.`;
          break;
        }
      }
      
      // "require" type questions: "Yes, I need X" eliminates ancestries without the tag
      if (q.type === "require" && answer === "yes") {
        if (!ancestry.tags || !ancestry.tags.includes(q.requireTag)) {
          eliminated = true;
          eliminationReason = `Q${i}: You require ${q.requireTag.replace(/_/g, ' ')}, but ${ancestry.name} does not have this trait.`;
          break;
        }
      }
      
      // "limit" type questions are handled above (Q0 only)
    }
    
    if (eliminated) {
      eliminatedAncestries.add(ancestry.id);
      ancestry.eliminationReason = eliminationReason;
    }
  }
  
  remainingAncestries = ANCESTRIES.filter(a => !eliminatedAncestries.has(a.id));
}

function scoreAncestryForStats(ancestry, primary, secondary) {
  let score = 0;
  if (ancestry.boosts && ancestry.boosts.includes(primary)) score += 100;
  if (score >= 100 && ancestry.boosts && ancestry.boosts.includes(secondary)) score += 10;
  if (ancestry.flaws && ancestry.flaws.includes(primary)) score -= 50;
  if (ancestry.flaws && ancestry.flaws.includes(secondary)) score -= 5;
  return score;
}

function sortByStatPreference(primary, secondary) {
  remainingAncestries.sort((a, b) => {
    return scoreAncestryForStats(b, primary, secondary) - scoreAncestryForStats(a, primary, secondary);
  });
}

function getChoiceButtons(q, index) {
  if (q.type === "avoid") {
    return `
      <button class="choice-btn" onclick="answerQuestion('dontcare')">
        <span class="choice-title">🤷 I don't care</span>
        <span class="choice-sub">Keep all ancestries regardless of this trait</span>
      </button>
      <button class="choice-btn" onclick="answerQuestion('no')">
        <span class="choice-title">❌ No, avoid these</span>
        <span class="choice-sub">Eliminate ancestries with this trait</span>
      </button>
    `;
  } else if (q.type === "require") {
    return `
      <button class="choice-btn" onclick="answerQuestion('dontcare')">
        <span class="choice-title">🤷 I don't care</span>
        <span class="choice-sub">Keep all ancestries regardless of this trait</span>
      </button>
      <button class="choice-btn" onclick="answerQuestion('yes')">
        <span class="choice-title">✅ Yes, I require this</span>
        <span class="choice-sub">Only keep ancestries with this trait</span>
      </button>
    `;
  } else if (q.type === "limit") {
    return `
      <button class="choice-btn" onclick="answerQuestion('dontcare')">
        <span class="choice-title">🤷 I don't care</span>
        <span class="choice-sub">Keep all ancestries from any source</span>
      </button>
      <button class="choice-btn" onclick="answerQuestion('yes')">
        <span class="choice-title">✅ Yes, only Core Rulebook</span>
        <span class="choice-sub">Only keep ancestries from the Core Rulebook</span>
      </button>
    `;
  } else if (q.type === "preference") {
    return `
      <button class="choice-btn" onclick="answerQuestion('dontcare')">
        <span class="choice-title">🤷 I don't care</span>
        <span class="choice-sub">Keep both mammals and non-mammals</span>
      </button>
      <button class="choice-btn" onclick="answerQuestion('yes')">
        <span class="choice-title">🐾 Yes, prefer mammals</span>
        <span class="choice-sub">Only keep warm-blooded ancestries with fur/hair</span>
      </button>
      <button class="choice-btn" onclick="answerQuestion('no')">
        <span class="choice-title">🦎 No, prefer non-mammals</span>
        <span class="choice-sub">Only keep reptiles, birds, plants, fish, etc.</span>
      </button>
    `;
  }
  return "";
}

function renderQuestion() {
  const q = QUESTIONS[currentQuestionIndex];
  const answeredCount = answers.filter(a => a !== undefined).length;
  const progressPercent = (answeredCount / QUESTIONS.length) * 100;
  
  const html = `
    <div class="progress-wrap">
      <div class="progress-label">Question ${currentQuestionIndex + 1} of ${QUESTIONS.length}</div>
      <div class="progress-track"><div class="progress-fill" style="width:${progressPercent}%"></div></div>
    </div>
    
    <div class="nav-row">
      ${currentQuestionIndex > 0 ? `<button class="back-btn" onclick="previousQuestion()">← Previous</button>` : ""}
    </div>
    
    <div class="q-card">
      <div class="q-text">${q.text}</div>
      ${q.sub ? `<div class="q-sub">${q.sub}</div>` : ""}
      <div class="choices" style="margin-top: 1.5rem;">
        ${getChoiceButtons(q, currentQuestionIndex)}
      </div>
    </div>
  `;
  
  document.getElementById("app").innerHTML = html;
}

function renderStatPrompt() {
  const stats = ["Strength", "Dexterity", "Constitution", "Intelligence", "Wisdom", "Charisma"];
  
  const html = `
    <div class="progress-wrap">
      <div class="progress-label">Almost there!</div>
      <div class="progress-track"><div class="progress-fill" style="width:100%"></div></div>
    </div>
    
    <div class="stat-prompt">
      <div class="q-text" style="margin-bottom: 1rem;">What are your most important ability scores?</div>
      <p style="color: var(--text-muted); margin-bottom: 1.5rem; font-family: 'Inter', sans-serif;">
        We'll sort the remaining ancestries by which give bonuses to your chosen stats.
      </p>
      
      <div class="stat-selector">
        <div class="stat-select">
          <label>🎯 Primary Ability Score</label>
          <select id="primaryStat">
            <option value="">Select...</option>
            ${stats.map(s => `<option value="${s}">${s}</option>`).join("")}
          </select>
        </div>
        <div class="stat-select">
          <label>📈 Secondary Ability Score</label>
          <select id="secondaryStat">
            <option value="">Select...</option>
            ${stats.map(s => `<option value="${s}">${s}</option>`).join("")}
          </select>
        </div>
      </div>
      
      <button class="btn btn-gold" onclick="submitStats()" style="margin-top: 1rem;">✨ Find My Ancestries ✨</button>
    </div>
  `;
  
  document.getElementById("app").innerHTML = html;
}

function renderResults() {
  const eliminationCount = eliminatedAncestries.size;
  const remainingCount = remainingAncestries.length;
  
  const eliminationList = ANCESTRIES.filter(a => eliminatedAncestries.has(a.id))
    .map(a => `<li><strong>${a.name}</strong>: ${a.eliminationReason || "Eliminated"}</li>`)
    .join("");
  
  const resultsHtml = remainingAncestries.map(ancestry => {
    const boostHtml = (ancestry.boosts || []).map(b => `<span class="stat-boost">+${b}</span>`).join("");
    const flawHtml = (ancestry.flaws || []).map(f => `<span class="stat-flaw">-${f}</span>`).join("");
    
    return `
      <div class="ancestry-card">
        <h3>${ancestry.name}</h3>
        <div class="ancestry-source">📖 ${ancestry.source || "Unknown source"}</div>
        <div class="ancestry-desc">${ancestry.description || "No description available."}</div>
        <div class="ancestry-stats">
          ${boostHtml}
          ${flawHtml}
        </div>
        <a href="${ancestry.aon || "#"}" target="_blank" class="ancestry-link">📚 View on Archives of Nethys</a>
      </div>
    `;
  }).join("");
  
  const html = `
    <div class="result-card">
      <div class="result-hero" style="background:linear-gradient(135deg, var(--gold-dark) 0%, var(--card-bg) 80%)">
        <div class="result-icon-wrap" style="background: var(--gold)">🌍</div>
        <div>
          <div class="result-name">Your Ancestry Matches</div>
          <div class="result-tagline">Based on your answers</div>
        </div>
      </div>
      
      <div class="result-body">
        <div style="margin-bottom: 1rem;">
          <div style="font-family: 'Inter', sans-serif;">After applying your preferences, <strong>${remainingCount}</strong> ancestries remain (${eliminationCount} eliminated).</div>
          <div style="font-family: 'Cinzel', serif; font-size: 0.85rem; color: var(--gold); margin-top: 0.5rem;">✨ Sorted by ${primaryStat} → ${secondaryStat} synergy</div>
        </div>
        
        ${eliminationCount > 0 ? `
        <div class="elimination-log">
          <details>
            <summary>📋 View eliminated ancestries (${eliminationCount})</summary>
            <ul>${eliminationList || "<li>None</li>"}</ul>
          </details>
        </div>
        ` : ""}
        
        <div class="ability-scores-grid">
          ${resultsHtml || '<p style="color: var(--text-muted); font-family: \'Inter\', sans-serif;">No ancestries match your preferences. Try being less restrictive!</p>'}
        </div>
        
        <div class="result-footer" style="margin-top: 2rem;">
          <button class="btn btn-gold" onclick="restartQuiz()">↩ Start Over</button>
        </div>
      </div>
    </div>
  `;
  
  document.getElementById("app").innerHTML = html;
}

function renderLoading() {
  document.getElementById("app").innerHTML = `
    <div class="loading-card">
      <div class="loading-spinner"></div>
      <div class="loading-text">Loading ancestries from the archives...</div>
    </div>
  `;
}

function renderError(message) {
  document.getElementById("app").innerHTML = `
    <div class="error-card">
      <p>⚠️ ${message}</p>
      <p>Make sure ancestry JSON files exist in the <code>/races/</code> folder.</p>
      <button class="btn btn-gold" onclick="location.reload()" style="margin-top:1rem">↩ Retry</button>
    </div>
  `;
}

function answerQuestion(answer) {
  answers[currentQuestionIndex] = answer;
  
  if (currentQuestionIndex + 1 < QUESTIONS.length) {
    currentQuestionIndex++;
    renderQuestion();
  } else {
    computeEliminations();
    renderStatPrompt();
  }
}

function previousQuestion() {
  if (currentQuestionIndex > 0) {
    currentQuestionIndex--;
    renderQuestion();
  }
}

function submitStats() {
  primaryStat = document.getElementById("primaryStat").value;
  secondaryStat = document.getElementById("secondaryStat").value;
  
  if (!primaryStat) {
    alert("Please select a primary ability score.");
    return;
  }
  
  sortByStatPreference(primaryStat, secondaryStat);
  renderResults();
}

function restartQuiz() {
  currentQuestionIndex = 0;
  answers = [];
  eliminatedAncestries.clear();
  primaryStat = "";
  secondaryStat = "";
  renderQuestion();
}

async function init() {
  renderLoading();
  const loaded = await loadAncestries();
  if (loaded && ANCESTRIES.length > 0) {
    renderQuestion();
  } else {
    renderError("Could not load ancestry data. Please ensure JSON files exist in /races/");
  }
}

init();
</script>
</body>
</html>
