<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PF2E — Character Builders</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
  <style>
    /* Additional homepage-specific styles */
    .quiz-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.75rem;
      margin: 2rem 0 1rem;
    }

    .quiz-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 1.75rem;
      transition: all 0.2s ease;
      cursor: pointer;
      text-decoration: none;
      display: block;
      color: inherit;
    }

    .quiz-card:hover {
      transform: translateY(-4px);
      border-color: var(--gold);
      box-shadow: var(--shadow);
    }

    .quiz-icon {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    .quiz-title {
      font-family: 'Cinzel', serif;
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: var(--gold-light);
    }

    .quiz-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 1rem;
      line-height: 1.5;
    }

    .quiz-meta {
      display: flex;
      gap: 1rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      border-top: 1px solid var(--card-border);
      padding-top: 1rem;
      margin-top: 0.5rem;
    }

    .badge {
      background: rgba(201, 168, 76, 0.15);
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      color: var(--gold);
      font-family: 'Cinzel', serif;
      font-size: 0.7rem;
      letter-spacing: 0.05em;
    }

    .home-footer {
      text-align: center;
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 1px solid var(--card-border);
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .add-note {
      display: inline-block;
      background: transparent;
      border: 1px dashed var(--card-border);
      padding: 0.5rem 1rem;
      border-radius: 30px;
      color: var(--text-muted);
      font-size: 0.8rem;
      margin-top: 1rem;
      cursor: default;
    }
  </style>
</head>
<body>
<div class="container">

  <header class="site-header">
    <div class="eyebrow">Pathfinder Second Edition</div>
    <h1>Character Builders</h1>
    <p class="subtitle">Choose your character creation tool</p>
  </header>

  <div id="quiz-list"></div>

<footer class="home-footer">
  <p>Pick a questionnaire to discover your ideal class or ancestry</p>
  <div class="add-note">➕ To add a new questionnaire: add HTML to /questionnaires/ and update the QUESTIONNAIRES array above</div>
</footer>

</div>

<script>
  // ============================================================
  //  QUESTIONNAIRE REGISTRY
  //  Add new questionnaires here to make them appear on the homepage
  // ============================================================
  
  const QUESTIONNAIRES = [
  {
    id: "class-picker",
    title: "🏛️ Class Picker",
    description: "The classic class recommendation tree. Answer a few questions about your playstyle and find your perfect Pathfinder 2E class.",
    icon: "🎲",
    tags: ["23 classes", "~5 min", "beginner friendly"],
    path: "questionnaires/class-picker.html"
  },
  {
    id: "race-picker",
    title: "🌍 Ancestry Picker",
    description: "Discover your ideal ancestry through 16 questions about appearance, culture, size, and playstyle preferences.",
    icon: "🧬",
    tags: ["59 ancestries", "~5 min", "elimination style"],
    path: "questionnaires/race-picker.html"
  }
  // ============================================================
  //  TO ADD A NEW QUESTIONNAIRE:
  //  Uncomment and modify the template below:
  // ============================================================
  // {
  //   id: "your-quiz-id",
  //   title: "🎯 Your Quiz Title",
  //   description: "Brief description of what this questionnaire helps with.",
  //   icon: "✨",
  //   tags: ["tag1", "tag2", "~X min"],
  //   path: "questionnaires/your-quiz.html"
  // }
];

  function renderQuizList() {
    const container = document.getElementById("quiz-list");
    
    if (QUESTIONNAIRES.length === 0) {
      container.innerHTML = `
        <div class="loading-card" style="text-align: center; padding: 3rem;">
          <div class="loading-text">No questionnaires available yet.</div>
          <div style="margin-top: 1rem; color: var(--text-muted);">Add questionnaires to the QUESTIONNAIRES array in index.html</div>
        </div>
      `;
      return;
    }

    const cards = QUESTIONNAIRES.map(quiz => `
      <a href="${quiz.path}" class="quiz-card">
        <div class="quiz-icon">${quiz.icon || "📜"}</div>
        <div class="quiz-title">${quiz.title}</div>
        <div class="quiz-desc">${quiz.description}</div>
        <div class="quiz-meta">
          ${quiz.tags.map(tag => `<span class="badge">${tag}</span>`).join('')}
        </div>
      </a>
    `).join('');

    container.innerHTML = `<div class="quiz-grid">${cards}</div>`;
  }

  renderQuizList();
</script>
</body>
</html>
